    <span class="bs-line" style="background:linear-gradient(90deg,transparent,#EBD5B7)"></span>
    <span class="bs-org">밀알복지재단</span>
    <span class="bs-line" style="background:linear-gradient(90deg,#EBD5B7,transparent)"></span>

  <div class="bs-dots"><i></i><i></i><i></i></div>
  <div id="bs-wait" style="display:none;margin-top:16px;font-size:12px;font-weight:600;color:#5C4033;"></div>
  <div id="bs-fail" style="display:none;margin-top:22px;max-width:300px;font-size:12.5px;line-height:1.7;color:#334155;font-weight:600;">
    화면을 불러오지 못했어요.<br/>인터넷 연결을 확인한 뒤 다시 시도해주세요.
    <div id="bs-fail-detail" style="margin-top:6px;font-size:10.5px;color:#94A3B8;font-weight:500;"></div>
    <button onclick="location.reload()" style="margin-top:12px;padding:10px 22px;border-radius:9999px;border:none;cursor:pointer;color:#fff;font-weight:700;font-size:13px;background:linear-gradient(135deg,#554036,#3C2C24);box-shadow:0 6px 16px rgba(177,96,62,.25);">다시 시도</button>
  </div>

<script>
/* 안전장치: 스크립트 로드 실패 → 즉시 안내 · 서버 응답 지연 → "연결 중 N초" 표시(실패 아님) · 30초 초과 → 다시 시도 안내 */
(function(){
  var failed = false, started = Date.now();
  function splash(){ var s = document.getElementById("boot-splash"); return (s && !s.classList.contains("bs-hide")) ? s : null; }
  function fail(msg){
    if(failed) return; failed = true;
    var s = splash(); if(!s) return;
    var d = s.querySelector(".bs-dots"); if(d) d.style.display = "none";
    var w = document.getElementById("bs-wait"); if(w) w.style.display = "none";
    var f = document.getElementById("bs-fail"); if(f) f.style.display = "block";
    var dt = document.getElementById("bs-fail-detail"); if(dt && msg) dt.textContent = msg;
  }
  window.addEventListener("error", function(e){
    var m = (e && e.message) || "";
    if(/is not defined|Cannot read|Unexpected/i.test(m)) fail("오류: " + m.slice(0,80));
  });
  var tick = setInterval(function(){
    var s = splash(); if(!s){ clearInterval(tick); return; }
    var sec = Math.round((Date.now() - started) / 1000);
    var missing = [];
    if(typeof React === "undefined") missing.push("React");
    if(typeof htm === "undefined") missing.push("htm");
    if(typeof window.GU === "undefined") missing.push("config");
    if(sec >= 8 && missing.length){ fail("불러오지 못한 항목: " + missing.join(", ")); clearInterval(tick); return; }
    var pending = (window.GU && window.GU.pending) || 0;
    if(sec >= 4){
      var w = document.getElementById("bs-wait");
      if(w){ w.style.display = "block"; w.textContent = pending > 0 ? ("서버에 연결하는 중이에요 · " + sec + "초") : ("준비 중이에요 · " + sec + "초"); }
    }
    if(sec >= 30){ fail("서버 응답이 너무 늦어요. 잠시 후 다시 시도해주세요."); clearInterval(tick); }
  }, 1000);
})();
</script>
