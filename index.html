<script>
document.addEventListener("DOMContentLoaded", function(){
  var GU = window.GU;

  // ⭐ 자동 로그인 정보가 있으면 랜딩을 건너뛰고 바로 앱으로 (replace → 뒤로가기 루프 방지)
  var saved = GU.loadAuth();
  if(saved && saved.uid && saved.pw){
    location.replace("app.html?v=" + GU.VERSION);
    return;
  }

  var ICONS = ['<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="fs-soil" x1="0" y1="57" x2="0" y2="80" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8B5A2B"/><stop offset="1" stop-color="#5D4037"/></linearGradient><linearGradient id="fs-leafL" x1="48" y1="47" x2="25" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#558B2F"/><stop offset="0.72" stop-color="#558B2F"/><stop offset="1" stop-color="#A4492D"/></linearGradient><linearGradient id="fs-leafR" x1="48" y1="47" x2="71" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7CB342"/><stop offset="0.72" stop-color="#7CB342"/><stop offset="1" stop-color="#B4703F"/></linearGradient></defs><path d="M20 80 C22 64 34 57 46 57 C58 57 70 64 72 80 Z" fill="url(#fs-soil)"/><ellipse cx="39" cy="64" rx="9" ry="3" fill="#B4703F" opacity="0.45"/><path d="M48 59 C47.5 53 47.5 49 48 43" fill="none" stroke="#558B2F" stroke-width="5" stroke-linecap="round"/><path d="M48 47 C36 45 26 36 25 24 C38 24 48 33 48 47 Z" fill="url(#fs-leafL)"/><path d="M48 47 C60 45 70 36 71 24 C58 24 48 33 48 47 Z" fill="url(#fs-leafR)"/><path d="M0 -7 L1.6 -2.6 L6.4 -4.2 L3.6 0.4 L5 4 L1.2 2.8 L0 7 L-1.2 2.8 L-5 4 L-3.6 0.4 L-6.4 -4.2 L-1.6 -2.6 Z" transform="translate(80 70) rotate(24) scale(0.9)" fill="#BC5B33"/></svg>', '<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="fb-body" x1="0" y1="36" x2="0" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#BC5B33"/><stop offset="1" stop-color="#A4492D"/></linearGradient></defs><path d="M35 44 C35 20 61 20 61 44" fill="none" stroke="#5D4037" stroke-width="5" stroke-linecap="round"/><path d="M40 48 C40 26 56 26 56 48" fill="none" stroke="#8B5A2B" stroke-width="5" stroke-linecap="round"/><rect x="25" y="36" width="46" height="42" rx="7" fill="url(#fb-body)"/><path d="M25 45 V43 C25 39 28 36 32 36 H64 C68 36 71 39 71 43 V45 Z" fill="#A4492D"/><path d="M0 4.6 C-5 0.8 -6.2 -2.4 -4.1 -4.4 C-2.3 -6 -0.6 -4.9 0 -3.1 C0.6 -4.9 2.3 -6 4.1 -4.4 C6.2 -2.4 5 0.8 0 4.6 Z" transform="translate(48 60) scale(1.5)" fill="#FDF0DC"/></svg>', '<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="fg-strap" x1="0" y1="38" x2="0" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FDF0DC"/><stop offset="1" stop-color="#DCAE85"/></linearGradient></defs><rect x="27" y="50" width="42" height="28" rx="5" fill="#A4492D"/><rect x="29" y="50" width="38" height="5" fill="#9A3412"/><rect x="22" y="38" width="52" height="14" rx="5" fill="#BC5B33"/><rect x="43" y="38" width="10" height="40" fill="url(#fg-strap)"/><ellipse cx="37" cy="33" rx="9" ry="5.5" transform="rotate(-22 37 33)" fill="#DCAE85"/><ellipse cx="59" cy="33" rx="9" ry="5.5" transform="rotate(22 59 33)" fill="#DCAE85"/><circle cx="48" cy="35" r="4.5" fill="#FDF0DC"/></svg>'];
  var SUBS = ["재단 본부 · 산하 사업부", "송파 굿윌스토어", "기빙플러스"];
  var listEl = document.getElementById("fac-list");
  GU.FACILITIES.forEach(function(fac, i){
    var btn = document.createElement("button");
    btn.className = "fac-card";
    btn.innerHTML =
      '<div class="fc-icon">' + ICONS[i % ICONS.length] + '</div>' +
      '<div><div class="fc-name">' + fac + '</div>' +
      '<div class="fc-sub">' + (SUBS[i] || "") + '</div></div>' +
      '<svg class="fc-arrow" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>';
    btn.addEventListener("click", function(){
      GU.saveFac(fac);
      // 시설을 URL로도 전달 — 저장소가 제한된 환경(사내 브라우저 정책 등)에서도 안전
      location.href = "app.html?fac=" + encodeURIComponent(fac) + "&v=" + GU.VERSION;
    });
    listEl.appendChild(btn);
  });

  // 오늘 쪽지 수 — 60초 로컬 캐시로 서버 재호출 억제
  function showCount(n){
    document.getElementById("today-count-num").textContent = n;
    document.getElementById("today-count").style.visibility = "visible";
  }
  var cached = null;
  try{ cached = JSON.parse(localStorage.getItem("gu3.landing") || "null"); }catch(e){}
  if(cached && (Date.now() - cached.at) < 60000){
    showCount(cached.n);
  }else{
    GU.api("getLanding").then(function(r){
      if(r && r.ok){
        showCount(r.todayCount || 0);
        try{ localStorage.setItem("gu3.landing", JSON.stringify({ n:r.todayCount||0, at:Date.now() })); }catch(e){}
      }
    });
  }
});
</script>
